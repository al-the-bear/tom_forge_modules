name: tom_forge_single_window_example
description: >-
  The single-window example: one YAML editor (tom_forge_yaml_editor) in a
  window of its own layout, with its own toolbar and menus drawn from the
  kit's models (tom_forge_kit) in Forge's look (tom_forge_shared_ui), and its
  own ForgeEditorHost. No panel shell, terminal, webview, analyzer, office or
  PDF editor.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The layout-free kit: DefaultKitApi, the ForgeEditorHost port the example
  # implements, the action registry and the menu and action bar models.
  tom_forge_kit:
    path: ../tom_forge_kit
  # Forge's look over the kit's models: the theme, the action bar, the menu
  # buttons and the editor surface.
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  # The YAML editor type (.yaml, .yml) the window opens its file with.
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor
  # The YAML editor itself: its debug trail switch (kYamlEditorDebug).
  tom_yaml_editor:
    path: ../tom_yaml_editor
  # The standard editing action ids, descriptors and keys (undo, redo, the
  # clipboard) the Edit menu and the toolbar name.
  tom_editors_shared:
    path: ../tom_editors_shared
  # The folder of the file on disk (TomLocalFileSystem).
  tom_file_system:
    path: ../../basics/tom_file_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
