name: tom_forge_pdf_pdfjs
description: >-
  Forge's pdf.js editor adapter: ForgePdfJsEditor, the pdf.js view
  (tom_pdf_pdfjs: Mozilla's pdf.js in a webview) as a Forge editor over the
  kit, and ForgePdfJsModule, which offers it under Open With for .pdf files,
  with its host over the kit's file system and notices. No shell, no PDFium.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit module, ForgeKitApi. Never
  # the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The editing actions and editor capabilities the adapter reports.
  tom_editors_shared:
    path: ../tom_editors_shared
  # FileHandlingResult.
  tom_forge_core:
    path: ../tom_forge_core
  # The view host every PDF view shares (TomPdfViewHost) and the pdf.js view
  # this package adapts (R6: one engine per package; no PDFium).
  tom_pdf_editor:
    path: ../../modules/tom_pdf_editor
  tom_pdf_pdfjs:
    path: ../../modules/tom_pdf_pdfjs
  # The binary save rules and the content server (TomBinaryFileAccess,
  # TomFileSystemBinaryFiles, TomLocalContentServer).
  tom_file_session:
    path: ../../modules/tom_file_session
  # The application's file system, for files without a local path.
  tom_file_system:
    path: ../../basics/tom_file_system

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Test support only: Forge's undo conformance harness and this adapter's
  # undo subject; the PDFium adapter's test support for the suite that runs
  # both PDF modules together, as an application composes them.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_pdf_pdfjs_testing:
    path: ../tom_forge_pdf_pdfjs_testing
  tom_forge_pdf_pdfium_testing:
    path: ../tom_forge_pdf_pdfium_testing
