name: tom_forge_revision_view
description: >-
  Forge's Revisions view as a kit component: the saved revisions of the active file (ForgeRevisionView), opened and restored through the kit, contributed to any application on the kit by forgeRevisionViewModule with a layout-free placement hint.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the view and module contracts, ForgeKitApi and its
  # services, the placement hint. Never the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The editor contract's types the tests' editor answers with.
  tom_forge_core:
    path: ../tom_forge_core
  # The in-memory file system the tests run a bare DefaultKitApi over.
  tom_file_system:
    path: ../../basics/tom_file_system

flutter:
  uses-material-design: true
