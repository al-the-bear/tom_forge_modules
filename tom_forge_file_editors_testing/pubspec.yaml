name: tom_forge_file_editors_testing
description: >-
  Test support for tom_forge_file_editors: the light file editors (plain text, .env, todo files) as undo subjects ForgeTextFileSubject, ForgeEnvFileSubject and ForgeTodoFileSubject, for Forge's undo conformance harness
  (tom_forge_ui_testing). Test-only: suites take it as a dev_dependency;
  nothing a product links depends on it. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # The module whose editors the subjects drive.
  tom_forge_file_editors:
    path: ../tom_forge_file_editors
  # The panel shell's plain-text editor (ForgePlainTextEditor) a subject
  # drives.
  tom_forge_shell:
    path: ../tom_forge_shell
  # Forge's undo conformance harness.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The file sessions the subjects save through.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  # The todo file's source view the todo subject types into.
  tom_todo_ui:
    path: ../../tom_ai/modules/tom_todo_ui

dev_dependencies:
  flutter_lints: ^6.0.0
