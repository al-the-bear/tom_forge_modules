name: tom_forge_office_route_evaluation
description: >-
  The office routes' evaluation harness (office/PDF prototype, part-evaluation):
  integration tests over the LibreOfficeKit route and the ZetaOffice route,
  run on macOS in a profile build, writing YAML results.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  tom_file_session:
    path: ../../../../tom_ai/modules/tom_file_session
  tom_office_editor:
    path: ../../../../tom_ai/modules/tom_office_editor
  tom_office_protocol:
    path: ../../../../tom_ai/modules/tom_office_protocol

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
