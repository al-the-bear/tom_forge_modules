name: tom_forge_office_editors
description: >-
  The office editors as Forge editor types: one module that opens office
  files itself and offers the LibreOfficeKit editor (the default) and
  ZetaOffice in the webview (comparison route) under Open With, with their
  host over Forge's files, notices, the binaries layer's helper and the
  LibreOffice path setting, and LibreOffice's row in External Tools.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit API and its services.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell, for what the kit does not have: LibreOffice as an
  # external tool of the Configuration panel (ForgeExternalTool,
  # ForgeToolCopy, ForgeToolState; its path in ForgePreferencesService), the
  # shell's registered file pickers (ForgeShellComponents), the host opening
  # links outside (shell.environment.openExternal) and the user's default
  # editor as the layout keeps it (DefaultLayoutController).
  # OfficeEditorsModule is a ForgeModule (activate(ForgeShellApi)) for them,
  # and so opens its editors in a middle panel (shell.layout.openEditor) and
  # offers them to Open With with one (ForgeEditorChoice).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  # The office editor (LibreOfficeKit helper), detection, ZetaOffice.
  tom_office_editor:
    path: ../../tom_ai/modules/tom_office_editor
  # The binary save rules (TomBinaryFiles, TomBinaryFileAccess).
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.2.0
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  tom_office_protocol:
    path: ../../tom_ai/modules/tom_office_protocol
  # Forge's undo conformance harness and this module's undo subjects.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_office_editors_testing:
    path: ../tom_forge_office_editors_testing
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, code editors, keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
