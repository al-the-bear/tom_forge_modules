name: tom_website_editor
description: "Forge module for editing and driving enterprise_flutter_web websites."
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  flutter:
    sdk: flutter
  tom_website_editor_core:
    path: ../tom_website_editor_core
  tom_forge_ui:
    path: ../tom_forge_ui
  # Direct deps for the §6 config editor: ForgeDiagnostic/ForgeTextRange/
  # FileHandlingResult come from tom_forge_core; the YAML controller the
  # WebsiteConfigEditor is built on comes from tom_yaml_editor.
  tom_forge_core:
    path: ../tom_forge_core
  tom_yaml_editor:
    path: ../tom_yaml_editor
  # Vendored fork consumed via path across the monorepo (same as
  # tom_editors_shared); powers the embedded website preview webview (§4).
  flutter_inappwebview:
    path: ../../tom_ai/xternal/tom_flutter_inappwebview/flutter_inappwebview
  # Span-precise YAML parsing for the §6a content browser: key spans locate each
  # field's source line so `# @manual` pins can be read + written exactly.
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
