name: tom_website_editor
description: "Forge module for editing and driving enterprise_flutter_web websites."
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  flutter:
    sdk: flutter
  tom_website_editor_core:
    path: ../tom_website_editor_core
  # The Forge kit: the editor and view contracts, the kit API and its
  # services.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The YAML adapter (ForgeYamlEditor) the website config editor builds on.
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor
  # The panel shell, for what the kit does not have: a settings section of the
  # configuration dialog (ForgeConfigPanel), the workspace root its config is
  # found under (shell.systemState.workspaceRootPath).
  # WebsiteEditorModule is a ForgeModule (activate(ForgeShellApi)) for them,
  # and so opens files through the panel layout (shell.layout.openFile).
  tom_forge_shell:
    path: ../tom_forge_shell
  # Direct deps for the §6 config editor: ForgeDiagnostic/ForgeTextRange/
  # FileHandlingResult come from tom_forge_core; the YAML controller the
  # WebsiteConfigEditor is built on comes from tom_yaml_editor.
  tom_forge_core:
    path: ../tom_forge_core
  tom_yaml_editor:
    path: ../tom_yaml_editor
  # Vendored fork consumed via path across the monorepo (same as
  # tom_editors_shared); powers the embedded website preview webview (§4).
  flutter_inappwebview:
    path: ../../tom_ai/xternal/tom_flutter_inappwebview/flutter_inappwebview
  # Span-precise YAML parsing for the §6a content browser: key spans locate each
  # field's source line so `# @manual` pins can be read + written exactly.
  yaml: ^3.1.2

dev_dependencies:
  # The Markdown and Dart editor types flutter_test_config.dart registers
  # beside the YAML one.
  tom_forge_md_editor:
    path: ../tom_forge_md_editor
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  flutter_test:
    sdk: flutter
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  flutter_lints: ^6.0.0
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, code editors (a dependency already), keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host

flutter:
  uses-material-design: true
