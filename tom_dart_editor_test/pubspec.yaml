name: tom_dart_editor_test
description: Test application for the tom_dart_editor Flutter library.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # The editor library
  tom_dart_editor:
    path: ../tom_dart_editor
  
  # Additional dependencies for the test app
  analyzer: ^14.5.0
  path: ^1.9.0
  dcli: ^8.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # tool/flutter_sdk.dart reads Flutter's embedder file.
  yaml: ^3.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sdk_summary.sum
    - assets/packages.sum
