<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local Asset Probe</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(130deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }
      .wrap {
        margin: 16px;
        padding: 16px;
        border: 2px solid #22d3ee;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.85);
      }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 10px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .dot { width: 14px; height: 14px; border-radius: 50%; }
      .ok { background: #22c55e; }
      .warn { background: #f59e0b; }
      .err { background: #ef4444; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Local HTML Asset Probe</h1>
      <p>If you can read this text and see colors, local asset HTML renders.</p>
      <div class="row">
        <div class="dot ok"></div><span>Green</span>
        <div class="dot warn"></div><span>Amber</span>
        <div class="dot err"></div><span>Red</span>
      </div>
      <p id="vp"></p>
    </div>
    <script>
      const vp = document.getElementById('vp');
      vp.textContent = `Viewport: ${window.innerWidth} x ${window.innerHeight}`;
      if (window.flutter_inappwebview?.callHandler) {
        window.flutter_inappwebview.callHandler('ProbeChannel', JSON.stringify({
          type: 'asset-loaded',
          width: window.innerWidth,
          height: window.innerHeight,
          userAgent: navigator.userAgent
        }));
      }
    </script>
  </body>
</html>
