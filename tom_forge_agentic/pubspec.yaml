name: tom_forge_agentic
description: >-
  The agent/chat UI of Tom Forge tools: the Forge chat module, the chat view
  and the prompt queue and trail editors, over tom_agentic_ui's views and
  controllers, which it re-exports. UI only — all non-UI logic (provider
  API, models, placeholder engine) lives in tom_core_agentic.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Non-UI agent layer: provider/model API, prompt-queue/trail/profile models,
  # placeholder engine, and the bridge connection scan/store. This package
  # renders UI over those models only.
  tom_core_agentic:
    path: ../../tom_ai/core_extension/tom_core_agentic
  # The workspace file system the agent sidecar stores read and write through.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

  # The agent views and controllers, re-exported from the barrel.
  tom_agentic_ui:
    path: ../../tom_ai/modules/tom_agentic_ui

  # The Forge kit: editors, views and the kit API the agent surfaces are
  # contributed through.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell, for its extras only: AgentChatModule is a ForgeModule
  # with activate(ForgeShellApi), because the panel shell's module registry
  # takes only ForgeModule (the specs editor registers it there).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_forge_core:
    path: ../tom_forge_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, code editors, keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host

flutter:
  uses-material-design: true
