name: tom_forge_office_zetaoffice_testing
description: >-
  Test support for tom_forge_office_zetaoffice: the ZetaOffice editor as an
  undo subject, with the checks it skips, a scripted ZetaOffice page, and the
  module in a panel shell over a memory file system, for Forge's undo
  conformance harness (tom_forge_ui_testing) and the adapter's suites.
  Test-only: suites take it as a dev_dependency; nothing a product links
  depends on it. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # The adapter whose editor and module the test bed drives.
  tom_forge_office_zetaoffice:
    path: ../tom_forge_office_zetaoffice
  # The kit types the test bed names (ForgeEditor).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell the module runs in (DefaultShellApi).
  tom_forge_shell:
    path: ../tom_forge_shell
  # Forge's undo conformance harness.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # ZetaOffice's own test doubles (package:tom_office_zetaoffice/testing.dart).
  tom_office_zetaoffice:
    path: ../../modules/tom_office_zetaoffice
  tom_file_session:
    path: ../../modules/tom_file_session
  tom_file_system:
    path: ../../basics/tom_file_system

dev_dependencies:
  flutter_lints: ^6.0.0
