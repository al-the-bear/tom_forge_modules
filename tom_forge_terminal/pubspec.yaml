name: tom_forge_terminal
description: >-
  Forge's terminal for the panel shell: PTY-backed terminal managers over tom_terminal_view and process-backed ones, and the Terminal view, as ForgeShellComponents.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The shell in a pseudo-terminal and the xterm widget (TomTerminalSession,
  # TomTerminalView), without Forge; this package is its Forge adapter.
  tom_terminal_view:
    path: ../tom_terminal_view
  # The view contract and its pieces (ForgeView, ForgeAction,
  # ForgeComponentSizeHints) the Terminal view is made of.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The terminal contracts (ForgeTerminalManager, ForgeTerminal,
  # ForgeOutputChannel) the managers implement; the kit does not export them.
  tom_forge_core:
    path: ../tom_forge_core
  # Only ForgeShellComponents, the panel shell's registration of the
  # terminal-manager factory and the Terminal view (forgeTerminalComponents);
  # the kit has no such registration.
  tom_forge_shell:
    path: ../tom_forge_shell
  # TomLocalFileSystem: a shell over a folder on disk gets PTY terminals.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
