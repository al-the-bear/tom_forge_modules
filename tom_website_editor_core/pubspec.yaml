name: tom_website_editor_core
description: >-
  Pure-Dart core for the tom_website_editor forge module: loads, validates, and
  placeholder-resolves tom.website-editor.yaml. No forge/Flutter dependencies.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  yaml: ^3.1.2
  # Reading YAML back as plain values (tomYamlToPlain). Not tom_build_base:
  # it is CLI tooling, and its dcli would bring the LGPL `ini` into every app
  # built on Forge.
  tom_basics: ^3.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
