include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    unused_import: warning

linter:
  rules:
    - prefer_single_quotes
    - sort_constructors_first
    - unnecessary_late
    - unnecessary_null_checks
    - unawaited_futures
