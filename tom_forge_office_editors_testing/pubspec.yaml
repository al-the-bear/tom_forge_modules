name: tom_forge_office_editors_testing
description: >-
  Test support for tom_forge_office_editors: the office editors
  (LibreOfficeKit, ZetaOffice) as undo subjects, with the checks each skips,
  a scripted LibreOffice helper and a scripted ZetaOffice page, for Forge's
  undo conformance harness (tom_forge_ui_testing). Test-only: suites take it
  as a dev_dependency; nothing a product links depends on it.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # The module whose editors the subjects drive.
  tom_forge_office_editors:
    path: ../tom_forge_office_editors
  # The panel shell the subjects' editors run in (DefaultShellApi).
  tom_forge_shell:
    path: ../tom_forge_shell
  # Forge's undo conformance harness.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The office editor's own test doubles (package:tom_office_editor/testing.dart).
  tom_office_editor:
    path: ../../tom_ai/modules/tom_office_editor
  tom_office_protocol:
    path: ../../tom_ai/modules/tom_office_protocol
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

dev_dependencies:
  flutter_lints: ^6.0.0
