name: tom_forge_core
description: >-
  Tom Forge's core types, service contracts and defaults: documents,
  diagnostics, decorations, the undo manager, the workspace edit and the
  services the shell and its editors share.
version: 2.0.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8

# Add regular dependencies here.
dependencies:
  # The gitignore rules (TomGitignoreSet) behind the file walk.
  tom_basics: ^3.3.0
  # The file-system contract the shell, its editors and the workspace edit
  # work on.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # The stack DefaultUndoManager runs on.
  tom_undo:
    path: ../../tom_ai/basics/tom_undo

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
