name: tom_editors_shared
description: >-
  Reusable Flutter widgets and utilities for tree-based structured editors.
  Provides generic tree views, validation framework, undo/redo history,
  syntax-highlighted text editor, and inline control widgets.
version: 0.1.0
repository: https://github.com/dart-lang/sdk/tree/main/tom_editors/tom_editors_shared

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/js/mermaid.min.js
