name: tom_editors_shared
description: >-
  Reusable Flutter widgets and utilities for tree-based structured editors.
  Provides generic tree views, validation framework, undo/redo history,
  syntax-highlighted text editor, and inline control widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  tom_undo:
    path: ../../tom_ai/basics/tom_undo
  flutter:
    sdk: flutter
  tom_forge_core:
    path: ../tom_forge_core
  flutter_inappwebview:
    path: ../../tom_ai/xternal/tom_flutter_inappwebview/flutter_inappwebview

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/js/mermaid.min.js
