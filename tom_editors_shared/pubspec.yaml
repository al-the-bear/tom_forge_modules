name: tom_editors_shared
description: >-
  Reusable Flutter widgets and utilities for tree-based structured editors.
  Provides generic tree views, validation framework, undo/redo history,
  syntax-highlighted text editor, and inline control widgets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  # The tree view, split panels, search box, controls and validation markers,
  # re-exported from the barrel.
  tom_ui_controls:
    path: ../../modules/tom_ui_controls
  tom_undo:
    path: ../../basics/tom_undo
  # The highlighter interface (SyntaxHighlighter, HighlightSpan), re-exported
  # from the barrel for one release.
  tom_text_highlight:
    path: ../../modules/tom_text_highlight
  flutter:
    sdk: flutter
  tom_forge_core:
    path: ../tom_forge_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
