# Local-development override: tom_doc_specs (a path dependency here) declares
# its tom_doc_scanner dependency as hosted for publishing; unify it with this
# package's own direct path dependency on the same checkout so version solving
# sees one source. Same mechanism as tom_som_dart_v0's generated overrides file.
dependency_overrides:
  tom_doc_scanner:
    path: ../../tom_ai/ai_build/tom_doc_scanner
