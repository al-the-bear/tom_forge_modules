name: tom_md_editor
description: >-
  Flutter markdown editor widget with graphical preview, section-based
  navigation and comprehensive theming support; diagrams, math, DocSpecs
  schemas and reviews come as plugin packages (tom_md_mermaid, tom_md_math,
  tom_md_docspecs, tom_md_review).
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  tom_undo:
    path: ../../tom_ai/basics/tom_undo
  flutter:
    sdk: flutter
  markdown: ^7.2.2
  # The code-block overlay's editor; highlighted through tom_text_highlight.
  code_text_field: ^1.1.0
  flutter_markdown: ^0.7.6
  flutter_svg: ^2.2.4
  path: ^1.9.0
  tom_editors_shared:
    path: ../tom_editors_shared
  # Code-block highlighting (preview and overlay).
  tom_text_highlight:
    path: ../../tom_ai/modules/tom_text_highlight
  # The undo stack the controller keeps its edit operations on.
  tom_forge_core:
    path: ../tom_forge_core
  # Files are read and written through the host's file system: on disk, in
  # memory, on the web.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

dev_dependencies:
  tom_web_build_probe:
    path: ../tom_web_build_probe
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
