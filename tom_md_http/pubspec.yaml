name: tom_md_http
description: >-
  A document provider for the Markdown editor (tom_md_editor) that edits a
  document on a web server: GET to open, PUT to save. License: BSD-3-Clause.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The editor whose document provider contract (MdDocumentProvider) this
  # package implements.
  tom_md_editor:
    path: ../tom_md_editor
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
