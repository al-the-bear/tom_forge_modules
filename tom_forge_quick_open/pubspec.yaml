name: tom_forge_quick_open
description: >-
  Forge's quick open as a kit component: one search over open editors, workspace files, actions and settings, the actions alone, or the second keys of a pending chord (ForgeQuickOpen), contributed to any application on the kit by forgeQuickOpenModule as the overlay it shows.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: ForgeKitApi (actions, shortcuts, state, file system), the
  # module contract and the quick-open contribution. Never the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit
  # ForgeSearchConfig and forgeLoadGitignores: how workspace files are
  # searched.
  tom_forge_core:
    path: ../tom_forge_core
  # The workspace files it lists (TomFileEntry), which the kit does not
  # re-export.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
