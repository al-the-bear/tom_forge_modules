name: tom_forge_files
description: >-
  What an editor and a file browser build on Tom Forge's file-system
  contract: the per-file editing session that keeps encoding, line endings and
  every untouched byte, the tree filter with its presets, and the `.env`
  codec.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.10.8

dependencies:
  meta: ^1.16.0
  # Text decoding that keeps the encoding, and globs.
  tom_basics: ">=3.3.0"
  # The file-system contract the session reads and writes through.
  tom_forge_core:
    path: ../tom_forge_core
  # The todo file names the filter's todo-siblings rule reads.
  # The shared todo model and the *.todo.yaml codec (tom_modules).
  tom_todo_model: ^1.0.1

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.25.6
