name: tom_forge_quests
description: >-
  The quest applications of Tom Forge: one Forge application per open quest
  (kind `quest`), a picker over the workspace's `_ai/quests/`, the frame the
  quest runtime's views fill (@TOM and @TOM WS on the left, editors in the
  middle, @CHAT and @WS at the bottom) and the application's lifecycle.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The quests are the directories under <workspace>/_ai/quests/, listed
  # through the shell's file system.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # The Forge kit: views, actions, dialogs, notifications, the file system.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell, for what the kit does not have: the quest applications
  # (shell.applications, ForgeApplication and its factory and lifecycle),
  # their panel layouts (PanelLayout, PanelConfig, MiddlePanelConfig,
  # PanelTabConfig) and the workspace root the quests are found under
  # (shell.systemState.workspaceRootPath). ForgeQuestsModule is a ForgeModule
  # (activate(ForgeShellApi)) for them.
  tom_forge_shell:
    path: ../tom_forge_shell

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Restart tests run over a real .forge directory in the workspace ztmp.
  shared_preferences: ^2.2.0
  tom_test_support:
    path: ../../tom_ai/basics/tom_test_support
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, the Markdown, Dart and YAML editor
  # types, keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_md_editor:
    path: ../tom_forge_md_editor
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host

flutter:
  uses-material-design: true
