name: tom_forge_pdf_editors
description: >-
  The PDF editors as Forge editor types: one module that opens .pdf files
  itself and offers the PDFium editor (the default) and the pdf.js view
  (comparison route) under Open With, with their host over Forge's file
  system, notices and binaries layer. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit API and its services.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell, for its extras only: PdfEditorsModule is a ForgeModule
  # with activate(ForgeShellApi) (the panel shell's module registry takes only
  # ForgeModule); it opens its editors in the panel layout
  # (shell.layout.openEditor with a middle panel, the user's default editor of
  # DefaultLayoutController), offers them to Open With (ForgeEditorChoice),
  # and the host opens links outside (shell.environment.openExternal).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  # The PDF editor (PDFium) and the pdf.js view.
  tom_pdf_editor:
    path: ../../tom_ai/modules/tom_pdf_editor
  # The binary save rules (TomBinaryFileAccess).
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  # The shell's file system, for files without a local path.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Forge's undo conformance harness and this module's undo subjects.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_pdf_editors_testing:
    path: ../tom_forge_pdf_editors_testing
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, code editors, keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
