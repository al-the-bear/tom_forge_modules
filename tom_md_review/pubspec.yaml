name: tom_md_review
description: >-
  Document reviews for the Markdown editor (tom_md_editor): CriticMarkup marks
  decided and review comments written through the TomSpecs Dart runtime
  (tom_som_dart_runtime). License: BSD-3-Clause.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The editor whose controller this package reviews with (guarded line
  # edits, one history).
  tom_md_editor:
    path: ../tom_md_editor
  # The TomSpecs runtime that decides review marks and numbers comments.
  tom_som_dart_runtime:
    path: ../../tom_ai/ai_build/tom_som_dart_runtime

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
