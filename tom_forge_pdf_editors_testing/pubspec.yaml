name: tom_forge_pdf_editors_testing
description: >-
  Test support for tom_forge_pdf_editors: the PDF editors (PDFium, pdf.js) as undo subjects, with the checks each skips, a scripted pdf.js page and a decoder that needs no real I/O, for Forge's undo conformance harness
  (tom_forge_ui_testing). Test-only: suites take it as a dev_dependency;
  nothing a product links depends on it. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # The module whose editors the subjects drive.
  tom_forge_pdf_editors:
    path: ../tom_forge_pdf_editors
  # The shell types and Forge's undo conformance harness.
  tom_forge_ui:
    path: ../tom_forge_ui
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The PDF editors' own test doubles (package:tom_pdf_editor/testing.dart).
  tom_pdf_editor:
    path: ../../tom_ai/modules/tom_pdf_editor

dev_dependencies:
  flutter_lints: ^6.0.0
