name: tom_forge_shell
description: >-
  Forge's panel shell: the shell API and its default services, the scaffold, panels, tab bar, menus, palette, configuration, views and the plain-text editor, without the terminal, the code editors or the platform keychain, which plug in through ForgeShellComponents.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tom_forge_core:
    path: ../tom_forge_core
  # The layout-free kit the shell is built on, re-exported.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The shell's theme tokens, dimensions and animations, shared with Webwork.
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  # The text types and editor contracts the shell shares with its editors.
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # The per-file session the plain-text editor edits through.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A shared_preferences platform the tests install, to prove that no
  # shared_preferences call is made with a store given.
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0
