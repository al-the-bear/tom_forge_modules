name: tom_forge_pdf_pdfium
description: >-
  Forge's PDFium editor adapter: ForgePdfEditor, the PDFium editor
  (tom_pdf_editor over tom_pdf_pdfium) as a Forge editor over the kit, and
  ForgePdfiumModule, which opens .pdf files in it (the default editor), with
  its host over the kit's file system, notices and the binaries layer's
  PDFium. No shell, no webview. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit module, ForgeKitApi. Never
  # the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The editing actions and editor capabilities the adapter reports.
  tom_editors_shared:
    path: ../tom_editors_shared
  # FileHandlingResult.
  tom_forge_core:
    path: ../tom_forge_core
  # The editor this package adapts (engine-neutral) and its PDFium engine
  # (R6: one engine per package; no pdf.js, no webview).
  tom_pdf_editor:
    path: ../../modules/tom_pdf_editor
  tom_pdf_pdfium:
    path: ../../modules/tom_pdf_pdfium
  # The binary save rules (TomBinaryFileAccess, TomFileSystemBinaryFiles).
  tom_file_session:
    path: ../../modules/tom_file_session
  # The application's file system, for files without a local path.
  tom_file_system:
    path: ../../basics/tom_file_system

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Test support only: Forge's undo conformance harness and this adapter's
  # undo subject.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_pdf_pdfium_testing:
    path: ../tom_forge_pdf_pdfium_testing
