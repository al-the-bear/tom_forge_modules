name: tom_forge_code_editors
description: >-
  Forge's code editors in the panel shell, kept for one release: a re-export of the Markdown, Dart and YAML editor adapters (tom_forge_md_editor, tom_forge_dart_editor, tom_forge_yaml_editor) with the shell-typed helpers it had (forgeCodeEditorComponents, dartSummaryAssets, registerMdEditor and its twins).
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The shell, for the helpers kept for one release: ForgeShellComponents,
  # DefaultLayoutController (dartSummaryAssets) and TomForgeShellModule
  # (registerMdEditor and its twins).
  tom_forge_shell:
    path: ../tom_forge_shell
  # The three adapters this package re-exports.
  tom_forge_md_editor:
    path: ../tom_forge_md_editor
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
