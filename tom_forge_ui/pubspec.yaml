name: tom_forge_ui
description: >-
  Tom Forge UI: Forge's panel shell (tom_forge_shell) with the terminal
  (tom_forge_terminal), the code editors (tom_forge_code_editors) and the
  platform keychain (tom_forge_platform_secrets), re-exported as one library.
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The umbrella: Forge's panel shell with the terminal, the code editors
  # and the platform keychain (useForgeDesktopComponents registers them).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets

dev_dependencies:
  flutter_test:
    sdk: flutter
  # What the suites build shells, files and editors from directly (the
  # umbrella only re-exports them).
  shared_preferences: ^2.2.0
  tom_forge_core:
    path: ../tom_forge_core
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  tom_dart_editor:
    path: ../tom_dart_editor
  tom_md_editor:
    path: ../tom_md_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor
  flutter_lints: ^6.0.0
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The workspace scratch folder the restart test's real .forge lives in.
  tom_test_support:
    path: ../../tom_ai/basics/tom_test_support
  # The golden harness and the network wait.
  tom_ui_testing:
    path: ../../tom_ai/modules/tom_ui_testing

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

