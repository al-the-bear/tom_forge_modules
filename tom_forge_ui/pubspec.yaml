name: tom_forge_ui
description: >-
  Tom Forge UI: Forge's panel shell (tom_forge_shell) with the terminal
  (tom_forge_terminal), the code editors (tom_forge_code_editors), the
  platform keychain (tom_forge_platform_secrets) and the views, packages of
  their own (Explorer, Search, Problems, Outline, Output, Revisions, quick
  open, the command palette), re-exported as one library.
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The umbrella: Forge's panel shell with the terminal, the code editors
  # and the platform keychain (useForgeDesktopComponents registers them).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_forge_terminal:
    path: ../tom_forge_terminal
  # The editor adapters whose editor types the desktop components hand a
  # shell: Markdown, Dart, YAML.
  tom_forge_md_editor:
    path: ../tom_forge_md_editor
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  tom_forge_yaml_editor:
    path: ../tom_forge_yaml_editor
  # The views, packages of their own on the kit, re-exported with their
  # modules (forgeDesktopViewModules).
  tom_forge_file_explorer:
    path: ../tom_forge_file_explorer
  tom_forge_search_view:
    path: ../tom_forge_search_view
  tom_forge_problems_view:
    path: ../tom_forge_problems_view
  tom_forge_outline_view:
    path: ../tom_forge_outline_view
  tom_forge_output_view:
    path: ../tom_forge_output_view
  tom_forge_revision_view:
    path: ../tom_forge_revision_view
  tom_forge_quick_open:
    path: ../tom_forge_quick_open
  tom_forge_command_palette:
    path: ../tom_forge_command_palette
  # The plain-text editor the shell falls back to, re-exported
  # (ForgePlainTextEditor).
  tom_forge_plain_text_editor:
    path: ../tom_forge_plain_text_editor
  # Re-exported for one release, with the shell-typed helpers it keeps
  # (dartSummaryAssets, registerMdEditor and its twins).
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host

dev_dependencies:
  flutter_test:
    sdk: flutter
  # What the suites build shells, files and editors from directly (the
  # umbrella only re-exports them).
  shared_preferences: ^2.2.0
  tom_forge_core:
    path: ../tom_forge_core
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_file_system:
    path: ../../basics/tom_file_system
  tom_dart_editor:
    path: ../tom_dart_editor
  tom_md_editor:
    path: ../tom_md_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor
  flutter_lints: ^6.0.0
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  # The workspace scratch folder the restart test's real .forge lives in.
  tom_test_support:
    path: ../../basics/tom_test_support
  # The golden harness and the network wait.
  tom_ui_testing:
    path: ../../modules/tom_ui_testing

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

