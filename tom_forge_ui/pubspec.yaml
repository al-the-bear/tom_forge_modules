name: tom_forge_ui
description: "A new Flutter package project."
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  tom_undo:
    path: ../../tom_ai/basics/tom_undo
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # The per-file session the plain-text editor edits through.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  flutter:
    sdk: flutter
  # lib/testing.dart (the undo conformance harness) is built on it.
  flutter_test:
    sdk: flutter
  file_picker: ^12.0.0
  # The shell's save dialog hands the chosen location back for the caller to
  # write; file_picker 12's saveFile writes the bytes itself, so the location
  # comes from file_selector.
  file_selector: ^1.1.0
  shared_preferences: ^2.2.0
  tom_forge_core:
    path: ../tom_forge_core
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_md_editor:
    path: ../tom_md_editor
  tom_dart_editor:
    path: ../tom_dart_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor
  flutter_pty: ^0.4.2
  xterm: ^4.0.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # The workspace scratch folder the restart test's real .forge lives in.
  tom_test_support:
    path: ../../tom_ai/basics/tom_test_support
  # The WCAG readability scan the shell's chrome is held to
  # (golden/shell_golden_test.dart): BSD-3, in Webwork's repository.
  tom_reusable_ui:
    path: ../../app_webwork/reusable/tom_reusable_ui

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
