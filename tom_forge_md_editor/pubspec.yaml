name: tom_forge_md_editor
description: >-
  Forge's Markdown editor adapter. The `.md` / `.markdown` editor type and `ForgeMdEditor`, the adapter that makes the Markdown editor (tom_md_editor) a Forge editor over the kit, without the shell.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The editor this package adapts.
  tom_md_editor:
    path: ../tom_md_editor
  # The editor's plugin packages, so Forge's Markdown editor has every
  # feature: Mermaid diagrams and math in the preview, DocSpecs schemas and
  # reviews on the controller.
  tom_md_mermaid:
    path: ../tom_md_mermaid
  tom_md_math:
    path: ../tom_md_math
  tom_md_docspecs:
    path: ../tom_md_docspecs
  tom_md_review:
    path: ../tom_md_review
  # The Forge kit: the editor contract, ForgeKitApi, the editor type, the
  # action integration (ShellEditorIntegration). Never the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The frame a file kind's editor shows the state of its file in
  # (ForgeSessionFileFrame).
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  # Diagnostics, text positions and options.
  tom_forge_core:
    path: ../tom_forge_core
  # The editing actions and editor capabilities the adapter reports.
  tom_editors_shared:
    path: ../tom_editors_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test support only: Forge's undo conformance harness with the file kind
  # test bed (it brings the panel shell to the suites, never to the
  # adapter), and the file kind editor's undo subject.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_md_editor_testing:
    path: ../tom_forge_md_editor_testing
