name: tom_specs_editor
description: >-
  TomSpecs Editor — a Tom Forge desktop app for authoring DocSpecs / CodeSpecs /
  Implementation specifications: model-driven document editor, structure
  browser, and an embedded Claude Code agent (chat, queue, trail) over the
  shared agent layer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Tom Forge shell: multi-app launcher, panels/layout, modules, editors.
  tom_forge_ui:
    path: ../tom_forge_ui
  tom_forge_core:
    path: ../tom_forge_core

  # Reusable agent/chat UI (composer, queue, trail, settings) — UI only.
  tom_forge_agentic:
    path: ../tom_forge_agentic

  # Non-UI agent layer: provider/model API, models, placeholder engine.
  tom_core_agentic:
    path: ../../tom_ai/core/tom_core_agentic

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled spec model graph (generated by tom_specs_clitool/bin/model_json.dart).
    # The DocSpecs schema assets are added in step 23 (schema generator).
    - assets/spec_model.json
