name: tom_specs_editor
description: >-
  TomSpecs Editor — a Tom Forge desktop app for authoring DocSpecs / CodeSpecs /
  Implementation specifications: model-driven document editor, structure
  browser, and an embedded Claude Code agent (chat, queue, trail) over the
  shared agent layer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Tom Forge shell: multi-app launcher, panels/layout, modules, editors.
  tom_forge_ui:
    path: ../tom_forge_ui
  tom_forge_core:
    path: ../tom_forge_core

  # Standard editing-action ids (undo/redo) used to wire the document
  # controller's undo/redo into the shell via ShellEditorIntegration (§10).
  tom_editors_shared:
    path: ../tom_editors_shared

  # Reusable agent/chat UI (composer, queue, trail, settings) — UI only.
  tom_forge_agentic:
    path: ../tom_forge_agentic

  # Non-UI agent layer: provider/model API, models, placeholder engine.
  tom_core_agentic:
    path: ../../tom_ai/core/tom_core_agentic

  # Agent SDK MCP surface: McpSdkServerConfig / SdkMcpTool / CallToolResult used
  # to expose the §8 navigation & mutation tools to the embedded agent. Same
  # hosted constraint tom_core_agentic resolves, so version solving stays clean.
  tom_vscode_scripting_api: ^1.1.0

  # Structural-review persistence (YAML) and review-file path resolution.
  yaml: ^3.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled spec model graph (generated by tom_specs_clitool/bin/model_json.dart),
    # stamped with the tom_specs_model version (§17, B2).
    - assets/spec_model.json
    # DocSpecs schemas (1 global PD + 12 projections), generated at build time by
    # tom_specs_clitool/bin/docspecs_schema.dart and versioned from the same model
    # stamp (§16/§17, S2). The directory ships a committed .gitkeep so a plain
    # `flutter pub get` (without a build) keeps a valid asset path; the generated
    # *.docspecs-schema.yaml files are gitignored build artifacts.
    - assets/docspecs-schema/
