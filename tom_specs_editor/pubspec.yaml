name: tom_specs_editor
description: >-
  TomSpecs Editor — a Tom Forge desktop app for authoring DocSpecs / CodeSpecs /
  Implementation specifications: model-driven document editor, structure
  browser, and an embedded Claude Code agent (chat, queue, trail) over the
  shared agent layer.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # The Forge kit: editors, views, actions, the kit API and its services.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The panel shell, because the TomSpecs Editor is an app of its own: it
  # makes its shell (DefaultShellApi, ForgeShellScaffold) and registers its
  # modules there (its own are ForgeModules with activate(ForgeShellApi),
  # AgentChatModule a ForgeKitModule); it brings three applications with
  # their panel layouts (ForgeApplication, PanelLayout and its configs), a
  # settings section (ForgeConfigPanel) and the shell's plain-text editor for
  # raw config files (ForgePlainTextEditor).
  tom_forge_shell:
    path: ../tom_forge_shell
  # The shell parts the app hands its shell (it is a desktop app of its own):
  # the terminal, the code editors, the platform keychain and the desktop
  # host (native file dialogs, shells, folders).
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
  # The local file system the raw-file editor saves through.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  tom_forge_core:
    path: ../tom_forge_core

  # Standard editing-action ids (undo/redo) used to wire the document
  # controller's undo/redo into the shell via ShellEditorIntegration
  # (`tom_specs_editor_specification.md` §10).
  tom_editors_shared:
    path: ../tom_editors_shared

  # Reusable agent/chat UI (composer, queue, trail, settings) — UI only.
  tom_forge_agentic:
    path: ../tom_forge_agentic

  # Summary-backed Dart code editor for code-typed (`@ContentType('code*')`)
  # spec fields (`tom_specs_editor_specification.md` §13 l / B1). Provides
  # SDK-free analysis via the pre-generated `assets/summaries/**.sum` bundles
  # that tom_dart_editor_bundler produces from this package's buildkit.yaml.
  tom_dart_editor:
    path: ../tom_dart_editor

  # Rich markdown renderer (tables/math/mermaid/embedded media) for content
  # previews where the lightweight inline renderer is insufficient
  # (`tom_specs_editor_specification.md` §13 j/m). SpecMarkdown routes rich
  # content here; short labels stay lightweight.
  tom_md_editor:
    path: ../tom_md_editor

  # NOT YET A DEPENDENCY, AND NOTHING PREVENTS IT
  # (`tom_specs_editor_specification.md` §13 k). Live Flutter-layout rendering
  # wants `tom_d4rt_flutter` (`SourceFlutterD4rt().build<Widget>(source,
  # context)`). The layout seam (`_LayoutField`) still renders a read-only
  # source preview, but only because the render is unwritten — **not** because
  # the dependency is un-takeable: `tom_d4rt_flutter` (tom_d4rt ^1.230),
  # `tom_d4rt` and `tom_dart_editor` are all on the analyzer-14 line.
  #
  # What remains, if you are here to do it: add `tom_d4rt_flutter`, fill the
  # single marked drop-in point in `_LayoutField`
  # (`lib/src/document/spec_document_editor.dart`), and check the render is
  # sandboxed to the same degree as the editor's other d4rt use. Tracked as
  # `OE-3a` in `tom_specs_editor_specification.md` §22.

  # Non-UI agent layer: provider/model API, models, placeholder engine.
  tom_core_agentic:
    path: ../../tom_ai/core_extension/tom_core_agentic

  # Generic TomSpecs Specification Object Model runtime: the path-keyed in-memory
  # document, the meta-model ("reflection") classes, and the document validator.
  # The editor's `spec_document.dart` / `spec_model.dart` are thin re-export
  # shims onto this package (step 3 of the multi-platform spec-model plan).
  tom_som_dart_runtime:
    path: ../../tom_ai/ai_build/tom_som_dart_runtime

  # TomSpecs scripting/engine plane (`llm_and_d4rt_tools.md` §3, plan step 18).
  # Linked **in-process** so the agent can run sandboxed D4rt scripts that edit
  # the live document. The editor imports only the Flutter-safe scripting facade
  # (`package:tom_spec_engine/scripting.dart` — the `spec` scope + scope
  # registry
  # + script tools), never the RAG memory plane (`tom_brain_memory`,
  #   server-only, `llm_and_d4rt_tools.md` §2), so the memory surface stays out
  #   of the Flutter compile.
  tom_spec_engine:
    path: ../../tom_ai/ai_build/tom_spec_engine

  # Agent SDK MCP surface: McpSdkServerConfig / SdkMcpTool / CallToolResult used
  # to expose the `tom_specs_editor_specification.md` §8 navigation & mutation
  # tools to the embedded agent. Same hosted constraint tom_core_agentic
  # resolves, so version solving stays clean.
  tom_vscode_scripting_api: ^6.0.0

  # Structural-review persistence (YAML) and review-file path resolution.
  yaml: ^3.1.2
  path: ^1.9.0

  # Native file open/save dialogs for the `tom_specs_editor_specification.md`
  # §15.2 markdown export/import (OE-19 per-file IO). Already resolved
  # transitively via tom_forge_desktop_host; declared directly because the editor's
  # markdown dialogs use it. The IO call sits behind a `MarkdownFileIo` seam so
  # the dialogs stay testable without the platform channel.
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The undo conformance harness and the shell test doubles.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled spec model graph (generated by
    # tom_specs_clitool/bin/model_json.dart), stamped with the tom_specs_model
    # version (`tom_specs_editor_specification.md` §17, B2).
    - assets/spec_model.json
    # DocSpecs schemas (1 global PD + 12 projections), generated at build time
    # by tom_specs_clitool/bin/docspecs_schema.dart and versioned from the same
    # model stamp (`tom_specs_editor_specification.md` §16/§17, S2). The
    # directory ships a committed .gitkeep so a plain `flutter pub get` (without
    # a build) keeps a valid asset path; the generated *.docspecs-schema.yaml
    # files are gitignored build artifacts.
    - assets/docspecs-schema/
    # Pre-generated analyzer summaries (sdk_summary.sum + per-scope
    # packages.sum) embedded by the build (`tom_specs_editor_specification.md`
    # §17 step 4 / B1), declared per summary scope in buildkit.yaml's
    # `dart-editor-bundler` block and produced by tom_dart_editor_bundler. The
    # directories ship committed .gitkeep files so `flutter pub get` keeps valid
    # asset paths; the heavy *.sum bundles are gitignored generated artifacts
    # (their canonical committed home is the tom_binaries L2 layer — see OE-1
    # questions note). Flutter asset directory entries are non-recursive, so
    # each non-sdk-only scope's subdir is listed explicitly. Code-typed fields
    # detect a scope's presence at runtime and fall back to a plain text field
    # when absent.
    - assets/summaries/
    - assets/summaries/d4rt-flutter/
