name: tom_dart_editor
description: A Flutter widget for editing Dart code with a light lexical syntax highlighter, code completion and diagnostics seams, error display, and comprehensive theming support. No analyzer; tom_dart_analysis brings the summary-backed analysis.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  tom_undo:
    path: ../../basics/tom_undo
  flutter:
    sdk: flutter
  
  # Shared editor infrastructure (ForgeEditorIntegration, actions, settings)
  tom_editors_shared:
    path: ../tom_editors_shared
  # The undo stack the editor keeps its text changes on.
  tom_forge_core:
    path: ../tom_forge_core

  # The highlighter interface the editor takes (SyntaxHighlighter,
  # TokenHighlighter); the light Dart highlighter is one.
  tom_text_highlight:
    path: ../../modules/tom_text_highlight

dev_dependencies:
  tom_web_build_probe:
    path: ../tom_web_build_probe
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  path: ^1.9.0

flutter:
  # This package does not include any assets.
