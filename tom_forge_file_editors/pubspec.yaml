name: tom_forge_file_editors
description: >-
  The file editors of a Forge shell: Forge's Markdown and YAML editors, the
  plain-text editor and the .env editor, each editing one file through a
  ForgeFileSession — its encoding and line endings kept, a save that checks
  the disk first — and claimed for the files they edit by one module.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit API and its services.
  tom_forge_kit:
    path: ../tom_forge_kit
  # The Markdown and YAML adapters (ForgeMdEditor, ForgeYamlEditor) the
  # combined Markdown and YAML file editors build on.
  tom_forge_code_editors:
    path: ../tom_forge_code_editors
  # The panel shell, for its extras only: FileEditorsModule is a ForgeModule
  # with activate(ForgeShellApi) (the panel shell's module registry takes only
  # ForgeModule); it opens its editors in the panel layout
  # (shell.layout.openEditor with a middle panel), offers them to Open With
  # (ForgeEditorChoice) and takes the shell's plain-text editor
  # (ForgePlainTextEditor of the shell's own module, TomForgeShellModule) for
  # text files.
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  tom_md_editor:
    path: ../tom_md_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor
  # The session each editor edits its file through.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  # The file editors and the Markdown renderer.
  tom_file_editors:
    path: ../../tom_ai/modules/tom_file_editors
  # The todo row, the details editor and the todo-file editor.
  tom_todo_ui:
    path: ../../tom_ai/modules/tom_todo_ui
  # The file system a todo file's siblings and schema are read through.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # Decoding a schema the todo-file editor reads.
  tom_basics: ">=3.3.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Forge's undo conformance harness and this module's undo subjects.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_file_editors_testing:
    path: ../tom_forge_file_editors_testing
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, code editors (a dependency already),
  # keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
