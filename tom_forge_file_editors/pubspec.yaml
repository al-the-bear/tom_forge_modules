name: tom_forge_file_editors
description: >-
  The file editors of a Forge shell: Forge's Markdown and YAML editors, the
  plain-text editor and the .env editor, each editing one file through a
  ForgeFileSession — its encoding and line endings kept, a save that checks
  the disk first — and claimed for the files they edit by one module.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The shell, its modules, the plain-text editor and the Markdown and YAML
  # adapters the combined editors build on.
  tom_forge_ui:
    path: ../tom_forge_ui
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  tom_md_editor:
    path: ../tom_md_editor
  tom_yaml_editor:
    path: ../tom_yaml_editor
  # The session each editor edits its file through.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  # The file editors and the Markdown renderer.
  tom_file_editors:
    path: ../../tom_ai/modules/tom_file_editors
  # The todo row, the details editor and the todo-file editor.
  tom_todo_ui:
    path: ../../tom_ai/modules/tom_todo_ui
  # The file system a todo file's siblings and schema are read through.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # Decoding a schema the todo-file editor reads.
  tom_basics: ">=3.3.0"
  # lib/testing.dart (the editors' undo conformance subjects) is built on it.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
