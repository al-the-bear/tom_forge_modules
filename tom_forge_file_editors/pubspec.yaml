name: tom_forge_file_editors
description: >-
  The light file editors of a Forge shell: the plain-text editor, the .env
  editor and the todo-file editor, each editing one file through a
  ForgeFileSession — its encoding and line endings kept, a save that checks
  the disk first — and claimed for the files they edit by one module, which
  opens the other kinds (Markdown, YAML) through the file kinds the
  application registers with it. License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.11.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the editor contract, the kit API and its services, the
  # file kinds the application registers (ForgeFileKindRegistry; the module
  # names none) and the session-file binding (ForgeSessionFile).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The frame the editors show their file's state in (ForgeSessionFileFrame).
  tom_forge_shared_ui:
    path: ../tom_forge_shared_ui
  # The panel shell, for what the kit does not have: the shell's plain-text
  # editor for text files (ForgePlainTextEditor) and the shell's own module
  # it and the registered kinds' editors integrate through
  # (TomForgeShellModule, from shell.modules, which hands the editors the
  # shell's API); the hosts' editor builders and Open With alternatives take
  # the shell's API (ForgeShellApi in ForgeFileEditorBuilder and
  # ForgeFileEditorAlternative.build). FileEditorsModule is a ForgeModule
  # (activate(ForgeShellApi)) for them, and so opens its editors in a middle
  # panel (shell.layout.openEditor) and offers them to Open With with one
  # (ForgeEditorChoice).
  tom_forge_shell:
    path: ../tom_forge_shell
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_forge_core:
    path: ../tom_forge_core
  # The .env editor and the host interface of the file editors.
  tom_file_editors:
    path: ../../tom_ai/modules/tom_file_editors
  # The todo row, the details editor and the todo-file editor.
  tom_todo_ui:
    path: ../../tom_ai/modules/tom_todo_ui
  # The file system a todo file's siblings and schema are read through.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # Decoding a schema the todo-file editor reads.
  tom_basics: ">=3.3.0"

dev_dependencies:
  # The sessions the undo suite makes (the editors take the session type
  # from the kit).
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  # The Dart editor type flutter_test_config.dart registers.
  tom_forge_dart_editor:
    path: ../tom_forge_dart_editor
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Forge's undo conformance harness and this module's undo subjects.
  tom_forge_ui_testing:
    path: ../tom_forge_ui_testing
  tom_forge_file_editors_testing:
    path: ../tom_forge_file_editors_testing
  # The desktop components flutter_test_config.dart registers for every
  # shell the suites make: terminal, Dart editor, keychain, desktop host.
  tom_forge_terminal:
    path: ../tom_forge_terminal
  tom_forge_platform_secrets:
    path: ../tom_forge_platform_secrets
  tom_forge_desktop_host:
    path: ../tom_forge_desktop_host
