name: tom_forge_shared_ui
description: >-
  The look Forge's shell and the applications beside it share: the ForgeShellTheme tokens, the shell's dimensions and animation timings, the action bar and the status bar, without the shell, the terminal, the editors or a webview.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Readable colours (WCAG AA) the theme tokens are checked against.
  tom_ui_support:
    path: ../../tom_ai/modules/tom_ui_support

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
