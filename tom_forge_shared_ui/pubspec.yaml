name: tom_forge_shared_ui
description: >-
  The look Forge's shell and the applications beside it share, drawing the models of tom_forge_kit: the ForgeShellTheme tokens, the shell's dimensions and animation timings, the action bar, status bar, menus and command list, the input box, quick pick, error recovery dialog and focus indicator, the notification toasts and history, the context menu, and the editor surface that shows any ForgeEditor connected to the kit, without a layout, the shell, the terminal, the editors or a webview.
  License: BSD-3-Clause.
publish_to: none
version: 0.2.0
repository: https://github.com/al-the-bear/tom_forge_modules

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The notification manager the toasts and the history read.
  tom_forge_core:
    path: ../tom_forge_core
  # The models the elements draw (actions, menus, status items, context-menu
  # entries, dialogs) and the API they act through.
  tom_forge_kit:
    path: ../tom_forge_kit
  # Readable colours (WCAG AA) the theme tokens are checked against.
  tom_ui_support:
    path: ../../modules/tom_ui_support
  # ForgeSessionFileFrame, the state of a session file above its editor
  # (re-exported; one implementation with tom_file_editors).
  tom_file_session_ui:
    path: ../../modules/tom_file_session_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The editor contract's types (state snapshot, standard editing actions)
  # the tests' editor reports.
  tom_editors_shared:
    path: ../tom_editors_shared
  # The in-memory file system of the bare DefaultKitApi the tests run on.
  tom_file_system:
    path: ../../basics/tom_file_system
  flutter_lints: ^6.0.0
