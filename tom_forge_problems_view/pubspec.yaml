name: tom_forge_problems_view
description: >-
  Forge's Problems view as a kit component: the diagnostics grouped by file with filters and search (ForgeProblemsView), a diagnostic opened at its position through the kit, contributed to any application on the kit by forgeProblemsViewModule with a layout-free placement hint.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The Forge kit: the view and module contracts, ForgeKitApi and its
  # services, the placement hint, the file navigator. Never the shell (R9).
  tom_forge_kit:
    path: ../tom_forge_kit
  # The diagnostics' types (ForgeDiagnostic, ForgeSeverity).
  tom_forge_core:
    path: ../tom_forge_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The in-memory file system the tests run a bare DefaultKitApi over.
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system

flutter:
  uses-material-design: true
