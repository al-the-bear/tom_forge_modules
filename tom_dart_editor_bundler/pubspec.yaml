name: tom_dart_editor_bundler
description: >-
  CLI tool that builds the summary `.sum` bundles and the generated scope-init
  helper consumed by the tom_dart_editor embedded code editor. Reads a
  `dart-editor-bundler` block from a consuming app's buildkit.yaml and emits one
  SDK summary plus one grouped package bundle per named scope.
version: 0.1.0
# Internal build tooling consumed by path within the workspace (like
# tom_specs_clitool); never published to pub.dev.
publish_to: none
repository: https://github.com/al-the-bear/tom_forge
homepage: https://github.com/al-the-bear/tom_forge/tree/main/tom_dart_editor_bundler
topics:
  - codegen
  - editor
  - analyzer

environment:
  sdk: ^3.10.4

dependencies:
  # CLI infrastructure (ToolRunner / ToolDefinition / arg + version + help
  # scaffolding). Base-first: never reimplement CLI plumbing locally.
  tom_build_base:
    path: ../../tom_ai/basics/tom_build_base
  # Base-first owner of the grouped package-bundle infrastructure (the
  # load-bearing package-resolver order). Consumed as the PUBLISHED package
  # (plan item 3 shipped GroupedPackageBundleBuilder in 0.5.0) — a version
  # constraint, NOT a path: the local checkout is behind origin and a path dep
  # would resolve the missing API the wrong way.
  # Floor 0.7.1: the summary cache is partitioned by Dart SDK version, not just
  # analyzer major, so a point-SDK bundle-format drift can't crash the cached
  # `.sum` reader (RCJ3).
  tom_analyzer_shared: ">=0.7.1"
  # Public SDK-summary entry-point only (`buildSdkSummary` /
  # `PhysicalResourceProvider`). The grouped packages.sum build stays delegated
  # to tom_analyzer_shared; per the plan item-3 decision the one-shot SDK summary
  # is produced at this generator layer via analyzer's public API — exactly as
  # tom_specs_clitool/bin/summaries.dart does. No analyzer `src/` internals.
  analyzer: ^10.0.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
