name: tom_forge_kit
description: >-
  Forge's layout-free kit: the component, editor and module contracts, the actions, shortcuts and context-menu entries as data, the kit API a component sees, the editor host port and the default services, without widgets or a layout of its own, so an application places its editors as it decides.
  License: BSD-3-Clause.
publish_to: none
version: 0.1.0
repository: https://github.com/al-the-bear/tom_forge

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tom_forge_core:
    path: ../tom_forge_core
  # The text types and editor contracts the kit shares with the editors.
  tom_editors_shared:
    path: ../tom_editors_shared
  tom_file_system:
    path: ../../tom_ai/basics/tom_file_system
  # The session a file kind's editor reads and saves its file through
  # (ForgeFileKindRequest, ForgeSessionFile); pure Dart.
  tom_file_session:
    path: ../../tom_ai/modules/tom_file_session
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # A shared_preferences platform the tests install, to prove that no
  # shared_preferences call is made with a store given.
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0
